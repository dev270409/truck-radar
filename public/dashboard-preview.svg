<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Truck Radar: gestione della flotta, dei viaggi e dei rendiconti">
  <rect width="1200" height="630" fill="#f5f6f5"/>
  <path d="M0 0h16v630H0z" fill="#0d1c3b"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="96" fill="#0d1c3b" font-size="24" font-weight="700">Truck Radar</text>
    <path d="M72 124h56" stroke="#c74312" stroke-width="4"/>

    <text x="72" y="226" fill="#17243b" font-size="54" font-weight="700">
      <tspan x="72" dy="0">Flotta e viaggi,</tspan>
      <tspan x="72" dy="64">in un solo</tspan>
      <tspan x="72" dy="64">gestionale</tspan>
    </text>
    <text x="72" y="452" fill="#526078" font-size="21">
      <tspan x="72" dy="0">Rendiconti, abbinamenti e assegnazioni</tspan>
      <tspan x="72" dy="31">con fonti e stime leggibili</tspan>
    </text>
    <text x="72" y="558" fill="#0d1c3b" font-size="18" font-weight="700">21 giorni di prova · senza carta</text>
  </g>

  <g transform="translate(600 82)">
    <rect width="528" height="466" rx="18" fill="#182234"/>
    <path d="M0 56h528" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="25" cy="28" r="5" fill="#c74312"/>
    <circle cx="44" cy="28" r="5" fill="#69758a"/>
    <circle cx="63" cy="28" r="5" fill="#69758a"/>
    <text x="86" y="33" fill="#dce3ee" font-family="Arial, Helvetica, sans-serif" font-size="14">Truck Radar · Viaggi</text>
    <rect x="433" y="16" width="77" height="24" rx="6" fill="#27354b"/>
    <text x="471.5" y="32" fill="#c5d0e0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Anteprima</text>

    <text x="32" y="98" fill="#aab7ca" font-family="Arial, Helvetica, sans-serif" font-size="13">Rendiconti e viaggi</text>
    <text x="32" y="130" fill="#f3f5f8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Dal documento alla flotta</text>

    <path d="M53 190v188" stroke="#59667b" stroke-width="2"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="53" cy="194" r="16" fill="#27354b"/>
      <text x="53" y="199" fill="#8ca9db" font-size="11" font-weight="700" text-anchor="middle">01</text>
      <text x="82" y="190" fill="#f3f5f8" font-size="16" font-weight="700">Rendiconto importato</text>
      <text x="82" y="213" fill="#aab7ca" font-size="13">Righe estratte da controllare</text>
      <rect x="417" y="181" width="79" height="26" rx="6" fill="#203c37"/>
      <text x="456.5" y="198" fill="#9ed7c8" font-size="12" text-anchor="middle">Pronto</text>

      <circle cx="53" cy="282" r="16" fill="#27354b" stroke="#c74312" stroke-width="2"/>
      <text x="53" y="287" fill="#e98a63" font-size="11" font-weight="700" text-anchor="middle">02</text>
      <text x="82" y="278" fill="#f3f5f8" font-size="16" font-weight="700">Abbinamento flotta</text>
      <text x="82" y="301" fill="#aab7ca" font-size="13">Suggerimento da verificare</text>
      <rect x="417" y="269" width="79" height="26" rx="6" fill="#44392c"/>
      <text x="456.5" y="286" fill="#e8c38f" font-size="12" text-anchor="middle">Controllo</text>

      <circle cx="53" cy="370" r="16" fill="#27354b"/>
      <text x="53" y="375" fill="#8ca9db" font-size="11" font-weight="700" text-anchor="middle">03</text>
      <text x="82" y="366" fill="#f3f5f8" font-size="16" font-weight="700">Viaggio</text>
      <text x="82" y="389" fill="#aab7ca" font-size="13">Mezzo e autista da assegnare</text>
      <rect x="417" y="357" width="79" height="26" rx="6" fill="#27354b"/>
      <text x="456.5" y="374" fill="#c5d0e0" font-size="12" text-anchor="middle">In attesa</text>
    </g>

    <path d="M32 425h464" stroke="#ffffff" stroke-opacity=".12"/>
