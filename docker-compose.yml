services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckradar
      POSTGRES_PASSWORD: truckradar
      POSTGRES_DB: truckradar
    volumes:
      - truckradar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckradar"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckradar:truckradar@db:5432/truckradar
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      TRUCK_RADAR_SELF_HOSTED: ${TRUCK_RADAR_SELF_HOSTED:-true}
      TRUCK_RADAR_LICENSE: ${TRUCK_RADAR_LICENSE:-}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "3000:3000"

volumes:
  truckradar-db:
